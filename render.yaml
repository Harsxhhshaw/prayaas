services:
  - type: web
    name: prayaas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prayaas-postgis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Allowed frontend origins. To support Vercel preview domains, add regex/domains via Render dashboard or append below.
      - key: CORS_ORIGINS
        value: '["https://prayaas-five.vercel.app", "https://prayaas-7fxgsq80i-harsxhhshaws-projects.vercel.app", "http://localhost:5173", "http://127.0.0.1:5173"]'


databases:
  - name: prayaas-postgis
    databaseName: prayaas
    user: prayaas
    plan: free
    region: oregon
