services:
  - type: web
    name: prayaas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prayaas-postgis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: prayaas-postgis
    databaseName: prayaas
    user: prayaas
    plan: free
    region: oregon
