services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: prayaas-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: prayaas
      POSTGRES_USER: prayaas
      POSTGRES_PASSWORD: prayaas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prayaas -d prayaas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prayaas-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://prayaas:prayaas@db:5432/prayaas
      APP_ENV: production
      APP_DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seeds.seed_chamoli &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
